<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service Areas · CleanBC Communities</title>
  <meta name="description" content="Pick a contractor service area by commute basin rather than by municipality: BC's 29 regional districts, 76 commute basins, and every one of the province's 3,216 places inside one of them." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="service-areas.css" />
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      var t = localStorage.getItem('cbc-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <!-- On a phone the selector is the page and the map is a second view of it.
       These tabs are the only way back from the map, so they sit outside .app,
       which the narrow-screen rules collapse to a single full-height pane. -->
  <nav class="sa-views" aria-label="Switch view">
    <button class="sa-view" id="view-areas" type="button" aria-pressed="true">Choose areas</button>
    <button class="sa-view" id="view-map" type="button" aria-pressed="false">Map</button>
  </nav>
  <div class="app" data-view="areas">
    <aside class="sidebar">
      <header class="sidebar__header">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">Service areas</span>
          <a class="sa-crumb" href="./">All places →</a>
        </div>
        <p class="brand__sub">
          Where will you travel to work? Open a regional district, then tick the
          areas you would drive to — the towns and hamlets around each one come
          with it.
        </p>
      </header>

      <section class="sa-summary" aria-live="polite">
        <div class="sa-summary__row">
          <span class="sa-summary__num" id="sum-basins">0</span>
          <span class="sa-summary__unit">areas</span>
          <span class="sa-summary__num" id="sum-places">0</span>
          <span class="sa-summary__unit">places</span>
          <span class="sa-summary__num" id="sum-pop">0</span>
          <span class="sa-summary__unit">people</span>
        </div>
        <p class="sa-summary__hint" id="sum-hint">Nothing selected yet.</p>
        <!-- What the selection involves, rather than what it is allowed to
             involve. Nothing here is a control. -->
        <div class="sa-travel" id="sum-travel" hidden></div>
      </section>

      <div class="search sa-search">
        <svg class="search__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" class="search__input" type="search" placeholder="Find a place, an area or a district" autocomplete="off" spellcheck="false" />
        <kbd class="search__kbd">/</kbd>
      </div>

      <div class="sa-tree" id="tree">
        <div class="list__state" id="tree-state">Loading…</div>
      </div>

      <footer class="sa-actions">
        <button class="sa-btn" id="clear" type="button">Clear</button>
        <button class="sa-btn" id="copy-link" type="button">Copy link</button>
        <button class="sa-btn sa-btn--primary" id="download" type="button">Download CSV</button>
      </footer>
    </aside>

    <main class="map-wrap">
      <div id="map" class="map" role="application" aria-label="Map of the selected service area"></div>

      <button id="theme" class="icon-btn theme-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
        <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>

      <div class="legend" id="legend" aria-label="Legend"></div>

      <section class="detail sa-detail" id="detail" hidden aria-live="polite">
        <button class="icon-btn detail__close" id="detail-close" type="button" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div class="detail__eyebrow" id="d-region"></div>
        <h2 class="detail__name" id="d-name"></h2>
        <div class="detail__hero">
          <span class="detail__num" id="d-pop"></span>
          <span class="detail__unit">people</span>
          <span class="pill" id="d-access"></span>
        </div>
        <p class="detail__note" id="d-note"></p>
        <dl class="detail__grid" id="d-grid"></dl>
        <button class="sa-btn sa-btn--primary sa-detail__take" id="d-take" type="button">Add this basin</button>
      </section>
    </main>
  </div>

  <!-- Asked once, the first time a pick commits to travel the contractor has
       not already taken on. A contractor who starts on Haida Gwaii is never
       asked whether they take ferries: they live there. -->
  <dialog class="sa-ask" id="ask" aria-labelledby="ask-title">
    <h2 class="sa-ask__title" id="ask-title"></h2>
    <p class="sa-ask__body" id="ask-body"></p>
    <ul class="sa-ask__list" id="ask-list"></ul>
    <div class="sa-ask__actions">
      <button class="sa-btn" id="ask-cancel" type="button" value="cancel">Cancel</button>
      <button class="sa-btn sa-btn--primary" id="ask-ok" type="button" value="ok">Yes, add it</button>
    </div>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.min.js"></script>
  <script src="service-areas.js"></script>
</body>
</html>
